{% extends 'base.html' %}
{% block title %}Link Expired — FileVault{% endblock %}

{% block body %}
<div class="d-flex align-items-center justify-content-center min-vh-100" style="background:var(--bg)">
  <div class="text-center px-4" style="max-width:460px">
    <div class="mb-4" style="font-size:3.5rem;line-height:1">
      <i class="bi bi-clock-history" style="color:#f59e0b"></i>
    </div>
    <h1 class="fw-bold mb-2" style="font-size:1.6rem;letter-spacing:-.02em;color:var(--text-primary)">Link expired</h1>
    <p class="mb-5" style="color:var(--text-muted);line-height:1.65">This shared link has expired and is no longer available. Ask the owner to share a new link.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary fw-semibold px-4">
      <i class="bi bi-house me-2"></i>Go Home
    </a>
  </div>
</div>
{% endblock %}
