{% extends 'base.html' %}
{% block title %}Not Found — FileVault{% endblock %}

{% block body %}
<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="text-center">
    <div class="display-1 fw-bold text-warning mb-3">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1 class="h2 mb-3">Page Not Found</h1>
    <p class="text-muted mb-4 fs-5">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
      <i class="bi bi-house me-2"></i>Go to Dashboard
    </a>
  </div>
</div>
{% endblock %}
