{% extends 'base.html' %}
{% block title %}Too Many Requests — FileVault{% endblock %}

{% block body %}
<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="text-center">
    <div class="display-1 fw-bold text-warning mb-3">
      <i class="bi bi-shield-exclamation"></i>
    </div>
    <h1 class="h2 mb-3">Too Many Attempts</h1>
    <p class="text-muted mb-4 fs-5">You have made too many requests. Please wait a moment and try again.</p>
    <a href="{{ url_for('auth_login') }}" class="btn btn-primary">
      <i class="bi bi-arrow-left me-2"></i>Back to Login
    </a>
  </div>
</div>
{% endblock %}
