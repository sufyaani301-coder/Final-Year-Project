{% extends 'base.html' %}
{% block title %}Access Denied — FileVault{% endblock %}

{% block body %}
<div class="d-flex align-items-center justify-content-center min-vh-100" style="background:var(--bg)">
  <div class="text-center px-4" style="max-width:460px">
    <div style="font-size:5rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:#ef4444;opacity:.15;margin-bottom:.25rem">403</div>
    <div class="mb-4" style="font-size:3rem;line-height:1">
      <i class="bi bi-shield-exclamation" style="color:#ef4444"></i>
    </div>
    <h1 class="fw-bold mb-2" style="font-size:1.6rem;letter-spacing:-.02em;color:var(--text-primary)">Access denied</h1>
    <p class="mb-5" style="color:var(--text-muted);line-height:1.65">You don't have permission to access this resource. If you think this is a mistake, contact your administrator.</p>
    <div class="d-flex gap-2 justify-content-center">
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary fw-semibold px-4">
        <i class="bi bi-house me-2"></i>Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="btn btn-outline-secondary fw-semibold px-4">
        <i class="bi bi-arrow-left me-2"></i>Go Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
